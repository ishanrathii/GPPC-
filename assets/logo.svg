  <g fill="#e3a93c">
    <path d="M100 150 C92 138 82 138 78 150 C86 156 96 156 100 150 Z"/>
    <path d="M100 150 C108 138 118 138 122 150 C114 156 104 156 100 150 Z"/>
    <path d="M100 154 C94 144 86 144 82 154 C90 160 98 160 100 154 Z" opacity="0.85"/>
    <path d="M100 154 C106 144 114 144 118 154 C110 160 102 160 100 154 Z" opacity="0.85"/>
    <path d="M100 156 C100 146 100 146 100 146 C96 152 96 158 100 160 C104 158 104 152 100 156 Z"/>
