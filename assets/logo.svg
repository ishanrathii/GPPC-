<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Gurunisa Prabha Prakash Chaitanya emblem">
  <defs>
    <radialGradient id="gold" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff6dc"/>
      <stop offset="55%" stop-color="#f4d27a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9b94c"/>
      <stop offset="50%" stop-color="#fff2c9"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#gold)"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#b8860b" stroke-width="1.5" opacity="0.6"/>

  <!-- halo rays -->
  <g stroke="#c9991f" stroke-width="2" opacity="0.55">
    <line x1="100" y1="22" x2="100" y2="40"/>
    <line x1="64" y1="33" x2="72" y2="49"/>
    <line x1="136" y1="33" x2="128" y2="49"/>
    <line x1="40" y1="58" x2="55" y2="68"/>
    <line x1="160" y1="58" x2="145" y2="68"/>
  </g>

  <!-- seated figure (meditation) -->
  <g fill="#6b4a12">
    <circle cx="100" cy="74" r="11"/>
    <path d="M100 86 C84 86 74 100 74 116 C74 122 80 124 86 122 L86 118 C86 108 92 100 100 100 C108 100 114 108 114 118 L114 122 C120 124 126 122 126 116 C126 100 116 86 100 86 Z"/>
